<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player Only</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100vw;
            height: 56.25vw; /* Maintains 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* Maintains 16:9 Aspect Ratio */
            border: none;
            z-index: 1;
        }

        .loader {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #3b82f6;
            font-family: sans-serif;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <div id="msg">Loading Stream...</div>
        </div>

        <iframe 
            id="videoPlayer" 
            src="" 
            allowfullscreen="true" 
            allow="autoplay; fullscreen; encrypted-media">
        </iframe>
    </div>

    <script>
        const API_URL = 'https://jiot.akcoder777.workers.dev/';
        const player = document.getElementById('videoPlayer');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('msg');

        async function loadStream() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                const channel = data.find(ch => {
                    const n = ch.name.toLowerCase();
                    return n.includes('star sports') && n.includes('1') && n.includes('hindi') && n.includes('hd');
                });

                if (channel) {
                    player.src = channel.link;
                    player.onload = () => loader.classList.add('hidden');
                } else {
                    msg.innerText = "Channel Not Found";
                }
            } catch (e) {
                msg.innerText = "Connection Error";
            }
        }

        // Auto-hide loader if iframe takes too long but starts playing
        setTimeout(() => { loader.classList.add('hidden'); }, 10000);

        loadStream();
    </script>
</body>
</html>
