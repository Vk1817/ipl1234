<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrickCast Live</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --primary:#3b82f6;
    --accent:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background:linear-gradient(180deg,#020617,#0f172a);
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:18px;
    font-weight:700;
    font-size:22px;
    background:linear-gradient(90deg,#2563eb,#1d4ed8);
    box-shadow:0 5px 25px rgba(0,0,0,0.4);
}

/* CONTAINER */
.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

/* PLAYER */
.player{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(59,130,246,0.3);
}

.player iframe{
    width:100%;
    height:230px;
    border:none;
}

/* ONE CLICK AD OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    z-index:5;
    background:transparent;
}

/* LIVE BADGE */
.live{
    position:absolute;
    top:10px;
    left:10px;
    background:#facc15;
    color:black;
    padding:5px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

/* DROPDOWN */
.controls{
    margin-top:12px;
    padding:12px;
    border-radius:14px;
    background:var(--card);
}

select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#020617;
    color:white;
    font-size:15px;
}

/* STATUS */
.status{
    text-align:center;
    margin-top:8px;
    font-size:13px;
    color:var(--accent);
}

/* SOCIAL */
.card{
    margin-top:14px;
    padding:16px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
}

.btns{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.btn{
    flex:1;
    text-align:center;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:600;
}

.telegram{background:#229ED9;}
.whatsapp{background:#25D366;}
.instagram{background:#e1306c;}

/* BANNER */
.banner{
    margin-top:12px;
}

.banner img{
    width:100%;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="header">🏏 CRICKCAST LIVE</div>

<div class="container">

    <!-- PLAYER -->
    <div class="player">
        <div class="live">LIVE</div>
        <div class="overlay" id="overlay"></div>

        <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- CHANNEL SELECT -->
    <div class="controls">
        <select id="channelSelect">
            <option>Loading channels...</option>
        </select>
        <div class="status" id="status">Fetching streams...</div>
    </div>

    <!-- SOCIAL -->
    <div class="card">
        <h3>🚀 Join CrickCast Community</h3>

        <div class="btns">
            <a href="https://t.me/addlist/6qALMSdKoVVkNWI1" class="btn telegram">Telegram</a>
            <a href="https://wa.me/447955881183?text=Join%20CrickCast" class="btn whatsapp">WhatsApp</a>
            <a href="https://www.instagram.com/crickcast.live" class="btn instagram">Instagram</a>
        </div>
    </div>

    <!-- BANNER -->
    <div class="banner">
        <a href="https://offstump.com" target="_blank">
            <img src="https://github.com/Vk1817/IPL1/blob/main/offstumphd.jpg?raw=true">
        </a>
    </div>

</div>

<script>
const API = "https://jiot.akcoder777.workers.dev/";
const player = document.getElementById("player");
const select = document.getElementById("channelSelect");
const status = document.getElementById("status");
const overlay = document.getElementById("overlay");

let channels = [];
let adShown = false;

// FETCH CHANNELS
async function loadChannels(){
    try{
        const res = await fetch(API);
        const data = await res.json();

        channels = data.filter(c => c.name.toLowerCase().includes("star sports"));

        select.innerHTML = channels.map((c,i)=>`<option value="${i}">${c.name}</option>`).join("");

        status.innerText = `Loaded ${channels.length} channels`;
        play(0);
    }catch(e){
        status.innerText = "Failed to load";
    }
}

// PLAY CHANNEL
function play(i){
    player.src = channels[i].link;
}

// CHANGE CHANNEL
select.addEventListener("change", e=>{
    play(e.target.value);
});

// ONE CLICK AD ONLY FIRST TIME
overlay.onclick = () => {
    if(!adShown){
        window.open("https://offstump.com","_blank");
        adShown = true;
        overlay.style.display="none";
    }
};

loadChannels();
</script>

</body>
</html>
