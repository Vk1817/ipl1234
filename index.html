<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRICKCAST-STAR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #3b82f6;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        /* Header */
        header {
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Dropdown Styling */
        .controls {
            width: 100%;
            background: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px; /* Prevents zoom on iOS */
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--text-main);
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        /* Custom Dropdown Arrow */
        .select-wrapper::after {
            content: "▼";
            font-size: 14px;
            color: var(--primary-color);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Player Wrapper */
        .player-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            /* Standard 16:9 Aspect Ratio */
            aspect-ratio: 16 / 9;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Loading Status */
        #status {
            text-align: center;
            font-size: 14px;
            color: var(--primary-color);
            margin-top: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CRICKCAST-STAR</h1>
        </header>

        <div class="controls">
            <div class="select-wrapper">
                <select id="channelSelect" disabled>
                    <option value="">Loading channels...</option>
                </select>
            </div>
            <div id="status">Fetching streams...</div>
        </div>

        <div class="player-wrapper">
            <iframe 
                id="videoPlayer" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true" 
                allow="autoplay; fullscreen; encrypted-media">
            </iframe>
        </div>
    </div>

    <script>
        const API_URL = 'https://jiot.akcoder777.workers.dev/';
        const channelSelect = document.getElementById('channelSelect');
        const videoPlayer = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');

        let starSportsChannels = [];

        async function init() {
            try {
                // 1. Fetch data
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const allChannels = await response.json();

                // 2. Filter only Star Sports channels
                let filtered = allChannels.filter(ch => 
                    ch.name.toLowerCase().includes('star sports')
                );

                // 3. Sort logic based on requirements
                // Priority 1: Hindi HD
                // Priority 2: HD (Non-Hindi)
                // Priority 3: Hindi (Non-HD)
                // Priority 4: Others
                filtered.sort((a, b) => {
                    const scoreA = getSortScore(a.name);
                    const scoreB = getSortScore(b.name);
                    
                    if (scoreA !== scoreB) {
                        return scoreA - scoreB;
                    }
                    // Alphabetical sorting for ties
                    return a.name.localeCompare(b.name);
                });

                starSportsChannels = filtered;

                // 4. Populate Dropdown
                if (starSportsChannels.length > 0) {
                    channelSelect.innerHTML = starSportsChannels.map((ch, index) => {
                        return `<option value="${index}">${ch.name}</option>`;
                    }).join('');
                    
                    channelSelect.disabled = false;
                    statusText.innerText = `Loaded ${starSportsChannels.length} channels.`;
                    statusText.style.color = '#10b981'; // Green color
                    
                    // Auto-play the first channel
                    playChannel(0);
                } else {
                    channelSelect.innerHTML = `<option value="">No Star Sports channels found</option>`;
                    statusText.innerText = "Error: No matching channels.";
                    statusText.style.color = '#ef4444'; // Red color
                }

            } catch (error) {
                console.error("Failed to load channels:", error);
                channelSelect.innerHTML = `<option value="">Failed to load</option>`;
                statusText.innerText = "Check your internet connection.";
                statusText.style.color = '#ef4444';
            }
        }

        // Scoring function for the custom sorting logic
        function getSortScore(name) {
            const lowerName = name.toLowerCase();
            const hasHindi = lowerName.includes('hindi');
            const hasHD = lowerName.includes('hd');

            if (hasHindi && hasHD) return 1;    // Hindi HD
            if (!hasHindi && hasHD) return 2;   // Normal HD
            if (hasHindi && !hasHD) return 3;   // Normal Hindi
            return 4;                           // Everything else
        }

        // Play the selected channel
        function playChannel(index) {
            const channel = starSportsChannels[index];
            if (channel && channel.link) {
                videoPlayer.src = channel.link;
            }
        }

        // Listen for user changing the dropdown
        channelSelect.addEventListener('change', (e) => {
            playChannel(e.target.value);
        });

        // Start the app
        init();
    </script>
</body>
</html>
