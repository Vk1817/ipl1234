<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrickCast Star Arena</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020617;
    --card:#0f172a;
    --blue:#3b82f6;
    --neon:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background: radial-gradient(circle at top,#020617,#000);
    color:white;
}

.header{
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:800;
    background:linear-gradient(90deg,#2563eb,#22c55e);
    box-shadow:0 0 30px rgba(59,130,246,0.6);
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.player{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(34,197,94,0.4);
}

/* iframe */
.player iframe{
    width:100%;
    height:240px;
    border:none;
}

/* ONE CLICK AD OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    z-index:5;
}

/* LIVE */
.live{
    position:absolute;
    top:12px;
    left:12px;
    background:#22c55e;
    padding:6px 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 5px #22c55e;}
    50%{box-shadow:0 0 20px #22c55e;}
    100%{box-shadow:0 0 5px #22c55e;}
}

.controls{
    margin-top:14px;
    background:var(--card);
    padding:14px;
    border-radius:14px;
}

select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    background:#020617;
    color:white;
}

.status{
    text-align:center;
    margin-top:8px;
    font-size:13px;
    color:#22c55e;
}

.premium-box{
    margin-top:15px;
    padding:18px;
    border-radius:16px;
    background:linear-gradient(135deg,#020617,#0f172a);
    text-align:center;
}

.social{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.btn{
    flex:1;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:600;
}

.btn img{
    width:20px;
}

.telegram{background:#229ED9;}
.instagram{background:#e1306c;}

.banner{
    margin-top:15px;
}

.banner img{
    width:100%;
    border-radius:14px;
}
</style>
</head>

<body>

<div class="header">🏏 CRICKCAST STAR ARENA</div>

<div class="container">

    <!-- PLAYER -->
    <div class="player">
        <div class="live">LIVE</div>

        <!-- ONE CLICK AD -->
        <div class="overlay" id="overlay"></div>

        <iframe 
            id="player"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-presentation">
        </iframe>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <select id="channelSelect">
            <option>Loading...</option>
        </select>
        <div class="status" id="status">Loading streams...</div>
    </div>

    <!-- MESSAGE -->
    <div class="premium-box">
        <h2>🔥 Experience IPL Like Never Before</h2>
        <p>Fast streams. Backup links. Zero miss action.</p>

        <div class="social">
            <a href="https://t.me/addlist/6qALMSdKoVVkNWI1" class="btn telegram">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png">
                Telegram
            </a>

            <a href="https://www.instagram.com/crickcast.live" class="btn instagram">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
                Instagram
            </a>
        </div>
    </div>

    <!-- BANNER (WHATSAPP AUTO MESSAGE) -->
    <div class="banner">
        <a href="https://wa.me/447955881183?text=Hello%20I%20want%20CrickCast%20Premium%20Access" target="_blank">
            <img src="https://github.com/Vk1817/IPL1/blob/main/offstumphd.jpg?raw=true">
        </a>
    </div>

</div>

<script>
const API = "https://jiot.akcoder777.workers.dev/";
const player = document.getElementById("player");
const select = document.getElementById("channelSelect");
const overlay = document.getElementById("overlay");

let channels = [];
let adShown = false;

async function load(){
    const res = await fetch(API);
    const data = await res.json();

    channels = data.filter(c=>c.name.toLowerCase().includes("star sports"));

    select.innerHTML = channels.map((c,i)=>`<option value="${i}">${c.name}</option>`).join("");

    play(0);
}

function play(i){
    player.src = channels[i].link;
}

select.onchange = e => play(e.target.value);

/* ONE CLICK OFFSTUMP AD */
overlay.onclick = ()=>{
    if(!adShown){
        window.open("https://offstump.com","_blank");
        adShown = true;
        overlay.style.display="none";
    }
};

load();
</script>

</body>
</html>
