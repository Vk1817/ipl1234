<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrickCast Star</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020617;
    --card:#0f172a;
    --blue:#3b82f6;
    --neon:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background: radial-gradient(circle at top,#020617,#000);
    color:white;
}

/* HEADER */
.header{
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:800;
    background:linear-gradient(90deg,#2563eb,#22c55e);
    letter-spacing:1px;
    box-shadow:0 0 30px rgba(59,130,246,0.6);
}

/* CONTAINER */
.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

/* PLAYER */
.player{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(34,197,94,0.4);
    border:1px solid rgba(255,255,255,0.1);
}

.player iframe{
    width:100%;
    height:240px;
    border:none;
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    z-index:5;
}

/* LIVE BADGE */
.live{
    position:absolute;
    top:12px;
    left:12px;
    background:#22c55e;
    padding:6px 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 5px #22c55e;}
    50%{box-shadow:0 0 20px #22c55e;}
    100%{box-shadow:0 0 5px #22c55e;}
}

/* DROPDOWN */
.controls{
    margin-top:14px;
    background:var(--card);
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.05);
}

select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    background:#020617;
    color:white;
    font-weight:600;
}

/* STATUS */
.status{
    text-align:center;
    margin-top:8px;
    font-size:13px;
    color:#22c55e;
}

/* PREMIUM MESSAGE */
.premium-box{
    margin-top:15px;
    padding:18px;
    border-radius:16px;
    background:linear-gradient(135deg,#020617,#0f172a);
    border:1px solid rgba(255,255,255,0.08);
    text-align:center;
}

.premium-box h2{
    font-size:18px;
    margin-bottom:8px;
    color:#3b82f6;
}

.premium-box p{
    font-size:14px;
    opacity:0.85;
}

/* SOCIAL (NO WHATSAPP HERE) */
.social{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.btn{
    flex:1;
    padding:12px;
    text-align:center;
    border-radius:10px;
    text-decoration:none;
    color:white;
    font-weight:600;
}

.telegram{background:#229ED9;}
.instagram{background:#e1306c;}

/* BANNER */
.banner{
    margin-top:15px;
}

.banner img{
    width:100%;
    border-radius:14px;
    box-shadow:0 0 25px rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="header">🏏 CRICKCAST LIVE EXPERIENCE</div>

<div class="container">

    <!-- PLAYER -->
    <div class="player">
        <div class="live">LIVE</div>
        <div class="overlay" id="overlay"></div>

        <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <select id="channelSelect">
            <option>Loading channels...</option>
        </select>
        <div class="status" id="status">Loading live feeds...</div>
    </div>

    <!-- PREMIUM MESSAGE -->
    <div class="premium-box">
        <h2>🔥 Experience IPL Like Never Before</h2>
        <p>
            Ultra-fast streams. Zero interruptions. Backup links ready.  
            Stay ahead of the game — never miss a single ball.
        </p>

        <div class="social">
            <a href="https://t.me/addlist/6qALMSdKoVVkNWI1" class="btn telegram">Telegram Updates</a>
            <a href="https://www.instagram.com/crickcast.live" class="btn instagram">Behind the Scenes</a>
        </div>
    </div>

    <!-- BANNER (WHATSAPP + OFFSTUMP) -->
    <div class="banner">
        <a href="https://wa.me/447955881183?text=CRICKCAST%20PREMIUM%20ACCESS" target="_blank">
            <img src="https://github.com/Vk1817/IPL1/blob/main/offstumphd.jpg?raw=true">
        </a>
    </div>

</div>

<script>
const API = "https://jiot.akcoder777.workers.dev/";
const player = document.getElementById("player");
const select = document.getElementById("channelSelect");
const status = document.getElementById("status");
const overlay = document.getElementById("overlay");

let channels = [];
let adShown = false;

async function load(){
    try{
        const res = await fetch(API);
        const data = await res.json();

        channels = data.filter(c=>c.name.toLowerCase().includes("star sports"));

        select.innerHTML = channels.map((c,i)=>`<option value="${i}">${c.name}</option>`).join("");

        status.innerText = `🔥 ${channels.length} Live Channels Ready`;
        play(0);
    }catch{
        status.innerText = "⚠️ Stream loading failed";
    }
}

function play(i){
    player.src = channels[i].link;
}

select.addEventListener("change",e=>{
    play(e.target.value);
});

/* ONE TIME OFFSTUMP */
overlay.onclick = ()=>{
    if(!adShown){
        window.open("https://offstump.com","_blank");
        adShown = true;
        overlay.style.display="none";
    }
};

load();
</script>

</body>
</html>
